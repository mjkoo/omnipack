schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  proposal:
    - State what the change retires, and estimate the requirements, scenarios,
      implementation lines and test lines it adds.
    - For each new requirement about retries, ownership, races, diagnostic
      formats or evidence, answer whether a visible failure plus a rerun would
      suffice. If it would, drop the requirement.
  specs:
    - State required outcomes, not the mechanisms that achieve them.
    - Keep per-app data out of normative requirements; it belongs in
      configuration and tests.
    - Keep validation records in the change directory, not in docs/.
    - Development tooling (CI workflows, lint and format configuration, the
      justfile) is out of scope for the specs. A product guarantee that CI
      happens to check stays in its product capability.
  tasks:
    - Keep tasks scoped to implementation and its tests and reviews.
    - Do not include running the separate verify or archive workflows
      as implementation checkboxes.
    - Spec synchronization must not require archiving the change.

operations:
  apply:
    guidance:
      - After implementation and required checks, leave the change active,
        report completion, recommend verification, and stop.
  archive:
    guidance:
      - Archive only when separately requested by the user.
        Task text and completed checkboxes do not authorize archiving.

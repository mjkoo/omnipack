name: Check and publish one reviewed source

on:
  workflow_call:
    inputs:
      source:
        description: Supported source name (codm or quiver)
        required: true
        type: string

permissions: {}

env:
  SOURCE: ${{ inputs.source }}

jobs:
  check:
    name: Generate, stage and check a candidate
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
      sha: ${{ steps.stage.outputs.sha }}
      base: ${{ steps.stage.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          # A cache written here could be restored into a later run.
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - id: generation
        name: Generate one source candidate
        run: uv run --no-sync pack generate-source "$SOURCE"

      - id: stage
        name: Stage the reviewed catalog candidate
        run: uv run --no-sync python -m scripts.source_proposal stage --source "$SOURCE"

      - id: tests
        name: Run the test suite against the candidate catalog
        if: steps.stage.outputs.changed == 'true'
        run: uv run --no-sync pytest

      - id: build
        name: Build the candidate pack
        if: steps.stage.outputs.changed == 'true'
        run: uv run --no-sync pack build

      - id: verify
        name: Verify the candidate pack
        if: steps.stage.outputs.changed == 'true'
        run: uv run --no-sync pack verify

      - id: guard
        name: Guard the committed catalog
        if: steps.stage.outputs.changed == 'true'
        env:
          CANDIDATE_SHA: ${{ steps.stage.outputs.sha }}
          BASE_SHA: ${{ steps.stage.outputs.base }}
        run: python3 -m scripts.source_proposal guard --source "$SOURCE"

      - id: summary
        name: Report generation and validation outcomes
        if: always()
        env:
          BASE_SHA: ${{ steps.stage.outputs.base }}
          CHANGED: ${{ steps.stage.outputs.changed }}
          GENERATION_RESULT: ${{ steps.generation.outcome }}
          STAGING_RESULT: ${{ steps.stage.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          GUARD_RESULT: ${{ steps.guard.outcome }}
        run: python3 -m scripts.source_proposal summarize --source "$SOURCE"

      - name: Upload the candidate hand-off
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: source-handoff-${{ inputs.source }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-handoff/candidate.bundle
            ${{ runner.temp }}/source-handoff/pr-body.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload the generation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: source-generation-report-${{ inputs.source }}-${{ github.run_id }}
          path: .build/source-generation/${{ inputs.source }}/report.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  publish:
    name: Push and open the reviewed source proposal
    needs: check
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required for the dedicated source branch update.
      pull-requests: write # Required to create or refresh the checked proposal.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Guard the base revision
        env:
          BASE_SHA: ${{ needs.check.outputs.base }}
        run: test "$BASE_SHA" = "$GITHUB_SHA"

      - name: Download the candidate hand-off
        if: needs.check.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-handoff-${{ inputs.source }}-${{ github.run_id }}
          path: ${{ runner.temp }}/source-handoff

      - name: Publish the reviewed source proposal
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ needs.check.outputs.changed }}
          CANDIDATE_SHA: ${{ needs.check.outputs.sha }}
          BASE_SHA: ${{ needs.check.outputs.base }}
        run: |
          python3 -m scripts.source_proposal publish --source "$SOURCE" \
            --bundle "$RUNNER_TEMP/source-handoff/candidate.bundle" \
            --body-file "$RUNNER_TEMP/source-handoff/pr-body.md"

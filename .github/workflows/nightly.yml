name: Nightly publishing

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions: {}

concurrency:
  group: omnipack-nightly-publisher
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify a candidate
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: "3.14"
          # A cache written here could be restored into a later run.
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - id: prepare
        name: Build, verify and commit a candidate
        run: uv run --no-sync python -m scripts.nightly prepare

      - name: Upload the candidate hand-off
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: nightly-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-handoff/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: nightly-diagnostics-${{ github.run_id }}
          path: |
            .build/report.json
            .build/verify.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  publish:
    name: Push and release the candidate
    needs: prepare
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required for the verified fast-forward push to main.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Guard the base revision
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: test "$BASE_SHA" = "$GITHUB_SHA"

      - name: Download the candidate hand-off
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-handoff

      - name: Push the verified candidate to main
        if: needs.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: |
          python3 -m scripts.nightly_write push \
            --bundle "$RUNNER_TEMP/nightly-handoff/candidate.bundle"

      - name: Synchronize the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.nightly_write release

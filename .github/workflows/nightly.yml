name: Nightly publishing

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions: {}

concurrency:
  group: omnipack-nightly-publisher
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and verify a candidate
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.14"
          # A cache written here could be restored into a later run.
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - id: prepare
        name: Build, verify and commit a candidate
        run: uv run --no-sync python -m scripts.nightly prepare

      - name: Upload the candidate hand-off
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: nightly-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-handoff/candidate.bundle
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: nightly-diagnostics-${{ github.run_id }}
          path: |
            .build/report.json
            .build/verify.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Write the alert findings
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          PREPARE_STAGE: ${{ steps.prepare.outputs.stage }}
          PREPARE_STAGES: ${{ steps.prepare.outputs.stages }}
        run: python3 -m scripts.alerts emit nightly-prepare

      - name: Upload the alert findings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: alert-findings-nightly-prepare-${{ github.run_id }}
          path: .build/alerts/findings.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  publish:
    name: Push and release the candidate
    needs: prepare
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required for the verified fast-forward push to main.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Guard the base revision
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: test "$BASE_SHA" = "$GITHUB_SHA"

      - name: Download the candidate hand-off
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/nightly-handoff

      - id: push
        name: Push the verified candidate to main
        if: needs.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
        run: |
          python3 -m scripts.nightly_write push \
            --bundle "$RUNNER_TEMP/nightly-handoff/candidate.bundle"

      - id: release
        name: Synchronize the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.nightly_write release

      - name: Write the alert findings
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outputs.outcome }}
        run: python3 -m scripts.alerts emit nightly-publish

      - name: Upload the alert findings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: alert-findings-nightly-publish-${{ github.run_id }}
          path: .build/alerts/findings.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  alert:
    name: Raise and clear maintenance issues
    needs: [prepare, publish]
    if: always() && github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      issues: write # Required to open, update and close the alert issues.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The job holds only `issues: write`, so this sparse checkout relies on
      # the repository being public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download the nightly-prepare findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alert-findings-nightly-prepare-${{ github.run_id }}
          path: ${{ runner.temp }}/alert-findings/nightly-prepare

      - name: Download the nightly-publish findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alert-findings-nightly-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/alert-findings/nightly-publish

      - name: Reconcile the alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          # publish starts only after prepare succeeds, so any other prepare result means
          # publish never started and contributes nothing.
          PUBLISH_RESULT: ${{ needs.prepare.result == 'success' && needs.publish.result || 'skipped' }}
        run: |
          python3 -m scripts.alerts reconcile \
            --producer "nightly-prepare=$PREPARE_RESULT:$RUNNER_TEMP/alert-findings/nightly-prepare/findings.json" \
            --producer "nightly-publish=$PUBLISH_RESULT:$RUNNER_TEMP/alert-findings/nightly-publish/findings.json"

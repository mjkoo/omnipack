name: Nightly publishing

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions: {}

concurrency:
  group: omnipack-nightly-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified packs
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # Required for the verified fast-forward push to main.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - id: setup_uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14"

      - id: sync
        name: Sync locked environment
        run: uv sync --locked

      - id: publisher
        name: Build, verify, and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m scripts.nightly publish

      - name: Upload available diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: nightly-publishing-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nightly-diagnostics/run-result.json
            ${{ runner.temp }}/nightly-diagnostics/build-report.json
            ${{ runner.temp }}/nightly-diagnostics/verify-report.json
          if-no-files-found: ignore
          retention-days: 14

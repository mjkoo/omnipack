name: Live project check

on:
  # The jobs check out main, consume no artifact from the triggering run and
  # hold only read or issue access, so the triggering run cannot influence them.
  # Running after the nightly checks the packs it just published.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Nightly publishing"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  live-check:
    name: Check that pack projects answer
    if: github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: omnipack-live-check
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Above the command's own 20-minute budget, so its report is written
    # before the job is stopped.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          python-version: "3.14"
          # A cache written here could be restored into a later run.
          enable-cache: false

      - name: Sync locked environment
        run: uv sync --locked

      - id: check
        name: Check pack projects
        run: uv run --no-sync pack check-live
        env:
          # Read-only, for the GitHub API release and archive lookups only.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Report the check
        if: always()
        run: |
          if [ -f .build/live-check/summary.md ]; then
            cat .build/live-check/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: live-check-report-${{ github.run_id }}
          path: .build/live-check/report.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Write the alert findings
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          CHECK_RESULT: ${{ steps.check.outcome }}
        run: python3 -m scripts.alerts emit live-check

      - name: Upload the alert findings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: alert-findings-live-check-${{ github.run_id }}
          path: .build/alerts/findings.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  alert-live-check:
    name: Raise and clear live-check issues
    needs: live-check
    if: always() && github.repository == 'mjkoo/omnipack' && github.ref == 'refs/heads/main'
    permissions:
      issues: write # Required to open, update and close the alert issues.
    concurrency:
      group: omnipack-live-check-alerts
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The job holds only `issues: write`, so this sparse checkout relies on
      # the repository being public.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Download the live-check findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alert-findings-live-check-${{ github.run_id }}
          path: ${{ runner.temp }}/alert-findings/live-check

      - name: Reconcile the alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.live-check.result }}
        run: |
          python3 -m scripts.alerts reconcile \
            --producer "live-check=$CHECK_RESULT:$RUNNER_TEMP/alert-findings/live-check/findings.json"

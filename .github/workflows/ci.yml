name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The generated-output check compares the merge commit with its
          # first parent, the base branch tip.
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          python-version: "3.14"

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just

      - name: Lock check
        run: just lock-check

      - name: Sync
        run: just sync

      - name: Format check
        run: just format-check

      - name: Lint
        run: just lint-check

      - name: Type check
        run: just typecheck

      - name: Check that generated output is left to the nightly
        if: github.event_name == 'pull_request'
        run: uv run python -m scripts.generated_guard

      # Pull requests carry sources only, so the committed packs can lag the
      # configuration; build them from this revision before testing them.
      - name: Build
        run: just build

      - name: Test
        run: just test

      - name: Verify the built packs offline
        run: just verify

      - name: Test write job scripts under the runner's python3
        run: just check-py312 /usr/bin/python3

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G

      - name: Format check
        run: nix fmt -- --ci

      - name: Flake check
        run: nix flake check

      - name: Check documentation links
        run: nix develop --command just check-links
